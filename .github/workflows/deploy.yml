name: Deploy
on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Triggering-run trust boundary facts
        run: |
          echo "workflow_run.event=${{ github.event.workflow_run.event }}"
          echo "workflow_run.head_repository=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "workflow_run.head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "PR_NUMBER=[$PR_NUMBER]"
          echo "pull_requests_len=$(jq -r '.workflow_run.pull_requests|length' "$GITHUB_EVENT_PATH")"
          echo "pull_requests_json=$(jq -c '[.workflow_run.pull_requests[]?|{number,head_repo:.head.repo.full_name}]' "$GITHUB_EVENT_PATH")"
          echo "oidc_url_present=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
      - name: Download artifact (types from brave/leo deploy.yml)
        uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe
        with:
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          name: build
          path: artifact
          allow_forks: false
      - name: Simulated privileged deploy
        env:
          AWS_REGION: us-west-2
        run: |
          set -x
          cd ./artifact/storybook-static
          echo "--- deployed content ---"
          cat index.html
          echo
          find . -type f
          echo "would upload to s3://REDACTED/pr-${PR_NUMBER}/commit-${HEAD_SHA}/"
